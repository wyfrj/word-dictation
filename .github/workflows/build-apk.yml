name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: docker://kivy/buildozer:latest
        with:
          args: |
            sh -c "
              cd android &&
              python3 -c \"
import sys, os
# 修改 check_root 函数
path = '/home/user/.venv/lib/python3.14/site-packages/buildozer/__init__.py'
with open(path, 'r') as f:
    lines = f.readlines()

# 找到 check_root 函数并注释掉 input() 调用
in_check_root = False
for i, line in enumerate(lines):
    if 'def check_root(self):' in line:
        in_check_root = True
    elif in_check_root and 'cont = input(' in line:
        lines[i] = '        cont = \\'y\\'  # Modified by CI\\n'
        in_check_root = False
        break

with open(path, 'w') as f:
    f.writelines(lines)
print('Modified check_root function')
\" &&
              buildozer android debug
            "

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-dictation-apk
          path: android/bin/*.apk
          if-no-files-found: error
